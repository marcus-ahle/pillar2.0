<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Schedule | Pillar Sports Academy</title>
  <meta name="description" content="Upcoming camps, clinics, evaluations and tournaments at Pillar Sports Academy in Rossford, Ohio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / Schedule</nav>
        <h1>What's coming up</h1>
        <p class="lead">Every dated camp, clinic, evaluation and tournament in one list. Register in one tap, or add it straight to your calendar.</p>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div class="results-bar" style="align-items:flex-start">
          <div class="chip-row" id="sport-chips" role="group" aria-label="Filter by sport"></div>
          <label class="toggle"><input type="checkbox" id="show-past"> Show past sessions</label>
        </div>
        <p class="note" id="sched-count" aria-live="polite" style="margin-bottom:2rem"></p>

        <div id="sport-scope"></div>
        <div id="agenda"></div>

        <div class="section-head" style="margin-top:3rem">
          <div><p class="eyebrow">Anytime</p><h2>Year-round programs</h2></div>
          <p class="muted" style="max-width:44ch">No fixed date: book a lesson, ask about training, or reach out about teams any time.</p>
        </div>
        <div class="grid grid-3" id="ongoing"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/site.js"></script>
  <script>
  (() => {
    const params = new URLSearchParams(location.search);
    const active = new Set((params.get('sport') || '').split(',').filter(Boolean));
    const remembered = getSport();
    if (remembered && !params.has('sport')) active.add(remembered); // open on the sport they last viewed
    let showPast = false;

    // Flatten every dated session
    const sessions = PROGRAMS.flatMap(p => (p.sessions || []).map(s => ({ ...s, p, d: parseDate(s.date) })))
      .sort((a, b) => a.d - b.d || (a.time || '').localeCompare(b.time || ''));

    const chips = document.getElementById('sport-chips');
    chips.innerHTML = `<button type="button" class="chip" data-val="" aria-pressed="false">All sports</button>` +
      Object.entries(SPORTS).map(([k, s]) => `<button type="button" class="chip" data-val="${k}" aria-pressed="false"><span class="dot" style="background:${s.color}"></span>${s.name}</button>`).join('');
    chips.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      const v = b.dataset.val;
      if (!v) active.clear(); else active.has(v) ? active.delete(v) : active.add(v);
      render();
    });
    document.getElementById('show-past').addEventListener('change', e => { showPast = e.target.checked; render(); });

    // ---- .ics generation (Add to calendar) ----
    function parseRange(time) {
      if (!time) return null;
      const [a, b] = time.split('–').map(s => s.trim());
      const rx = /(\d{1,2}):(\d{2})\s*(AM|PM)?/i;
      const ma = a.match(rx), mb = b && b.match(rx); if (!ma || !mb) return null;
      const to24 = (h, mer) => { h = +h; if (mer.toUpperCase() === 'PM' && h !== 12) h += 12; if (mer.toUpperCase() === 'AM' && h === 12) h = 0; return h; };
      const merB = mb[3] || 'AM', merA = ma[3] || merB;
      return [[to24(ma[1], merA), +ma[2]], [to24(mb[1], merB), +mb[2]]];
    }
    const pad = n => String(n).padStart(2, '0');
    const ymd = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
    function ics(s) {
      const r = parseRange(s.time);
      const day = ymd(s.d);
      const next = new Date(s.d); next.setDate(next.getDate() + 1);
      const when = r ? `DTSTART:${day}T${pad(r[0][0])}${pad(r[0][1])}00\r\nDTEND:${day}T${pad(r[1][0])}${pad(r[1][1])}00`
                     : `DTSTART;VALUE=DATE:${day}\r\nDTEND;VALUE=DATE:${ymd(next)}`;
      const body = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Pillar Sports Academy//Schedule//EN', 'BEGIN:VEVENT',
        `UID:${s.p.id}-${day}-${(s.label || '').replace(/\W/g, '')}@pillarsportsacademy.com`,
        `DTSTAMP:${ymd(new Date())}T000000Z`, when,
        `SUMMARY:${SPORTS[s.p.sport].name}: ${s.p.title}${s.label ? ' (' + s.label + ')' : ''}`,
        'LOCATION:Pillar Sports\\, Rossford\\, OH',
        `DESCRIPTION:${s.p.summary.replace(/,/g, '\\,')}${s.url ? '\\n\\nRegister: ' + s.url : ''}`,
        'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
      return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(body);
    }

    function render() {
      chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.val ? active.has(c.dataset.val) : active.size === 0));
      if (active.size === 1) setSport([...active][0]); else if (!active.size) setSport(null);
      const only = active.size === 1 ? [...active][0] : null;
      const scopeEl = document.getElementById('sport-scope');
      scopeEl.innerHTML = only && only !== 'volleyball'
        ? `<div class="sport-scope" style="--sport:${SPORTS[only].color}"><p>Showing <strong>${SPORTS[only].name}</strong> only.</p><a href="${sportLink(only)}">${SPORTS[only].name} home</a><button type="button" data-all-sports>Show all sports</button></div>` : '';
      const allBtn = scopeEl.querySelector('[data-all-sports]');
      if (allBtn) allBtn.addEventListener('click', () => { active.clear(); render(); });
      const list = sessions.filter(s => (!active.size || active.has(s.p.sport)) && (showPast || s.d >= TODAY));
      const upcomingN = list.filter(s => s.d >= TODAY).length;
      document.getElementById('sched-count').textContent = `${upcomingN} upcoming session${upcomingN === 1 ? '' : 's'}${showPast ? ` · ${list.length - upcomingN} past` : ''}`;

      const byMonth = {};
      list.forEach(s => { const k = fmt(s.d, { month: 'long', year: 'numeric' }); (byMonth[k] = byMonth[k] || []).push(s); });

      document.getElementById('agenda').innerHTML = Object.keys(byMonth).length ? Object.entries(byMonth).map(([month, items]) => `
        <section class="agenda-month" aria-label="${month}">
          <h2>${month} <span>${items.length} session${items.length === 1 ? '' : 's'}</span></h2>
          ${items.map(s => {
            const past = s.d < TODAY, sp = SPORTS[s.p.sport];
            const reg = past ? '<span class="badge badge-closed">Ended</span>'
              : s.soldOut ? `<span class="badge badge-full">Sold out</span><a class="btn btn-outline btn-sm" href="contact.html?topic=notify&program=${s.p.id}">${icon('bell')} Notify me</a>`
              : `<a class="btn btn-primary btn-sm" href="${s.url}"${linkAttrs(s.url)} aria-label="Register for ${esc(s.p.title)} on ${fmt(s.d, { month: 'long', day: 'numeric' })}">Register ${icon('ext')}</a>`;
            const cal = past ? '' : `<a class="btn btn-outline btn-sm" href="${ics(s)}" download="pillar-${s.p.id}-${s.date}.ics" aria-label="Add ${esc(s.p.title)} to calendar">${icon('calendar')} Add to calendar</a>`;
            return `<article class="agenda-item${past ? ' past' : ''}" style="--sport:${sp.color}">
              <div class="agenda-date" aria-hidden="true"><span class="dow">${fmt(s.d, { weekday: 'short' })}</span><span class="day">${s.d.getDate()}</span></div>
              <div class="agenda-body">
                <span class="tag tag-${s.p.sport}">${sp.name}</span> <span class="tag tag-neutral">${s.p.type}</span>
                <h3>${esc(s.p.title)}${s.label && s.label !== s.p.title ? ` <span class="muted" style="font-weight:500">· ${esc(s.label)}</span>` : ''}</h3>
                <div class="meta"><span>${fmt(s.d, { weekday: 'long', month: 'long', day: 'numeric' })}</span>${s.time ? `<span>${s.time}</span>` : ''}<span>${esc(s.p.ageLabel)}</span>${s.p.capacity ? `<span>${esc(s.p.capacity)}</span>` : ''}</div>
              </div>
              <div class="agenda-actions">${cal}${reg}</div>
            </article>`;
          }).join('')}
        </section>`).join('')
        : `<div class="empty"><h3>Nothing on the calendar for that filter yet</h3><p>New dates post here first. <a href="contact.html?topic=notify">Get notified</a> or check year-round programs below.</p></div>`;

      const ongoing = PROGRAMS.filter(p => p.ongoing && !p.sessions && (!active.size || active.has(p.sport)));
      document.getElementById('ongoing').innerHTML = ongoing.map(p => renderProgramCard(p, { compact: true })).join('');
      const t = new URLSearchParams(location.search).get('today');
      const q = new URLSearchParams(); if (active.size) q.set('sport', [...active].join(',')); if (t) q.set('today', t);
      history.replaceState(null, '', q.toString() ? '?' + q : location.pathname);
    }
    render();
  })();
  </script>
</body>
</html>
